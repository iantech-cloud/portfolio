{% extends 'base.html' %}
{% block content %}<main class="container page-shell"><p class="eyebrow">Search</p><h1>Search results</h1><form class="search-form" method="get"><input name="q" value="{{ query }}" placeholder="Search projects and articles" aria-label="Search"><button class="button button-primary">Search</button></form>{% if query %}<p class="muted">Results for “{{ query }}”</p>{% endif %}<div class="card-grid">{% for item in page %}<article class="card"><p class="eyebrow">Result</p><h2>{{ item.title|default:item.name }}</h2><a href="{{ item.get_absolute_url }}">Read more</a></article>{% empty %}<p>No results yet. Try another search.</p>{% endfor %}</div></main>{% endblock %}
