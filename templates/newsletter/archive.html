{% extends 'base.html' %}{% block content %}<main class="container page-shell"><p class="eyebrow">Newsletter</p><h1>Archive</h1><div class="card-grid">{% for campaign in page %}<article class="card"><p class="eyebrow">{{ campaign.sent_at|date:'F Y' }}</p><h2><a href="{% url 'newsletter:campaign_detail' campaign.pk %}">{{ campaign.title }}</a></h2><p>{{ campaign.subject }}</p></article>{% empty %}<p>Past editions will appear here.</p>{% endfor %}</div></main>{% endblock %}
