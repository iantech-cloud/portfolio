{% csrf_token %}
{% for field in form %}
  <div class="field">
    {{ field.label_tag }}
    {{ field }}
    {% if field.help_text %}<small>{{ field.help_text }}</small>{% endif %}
    {% for error in field.errors %}<span class="error">{{ error }}</span>{% endfor %}
  </div>
{% endfor %}
{% if form.non_field_errors %}<div class="error">{{ form.non_field_errors }}</div>{% endif %}
